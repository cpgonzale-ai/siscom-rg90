name: CI frontend

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx vite build
      # Solo dependencias de producción (las que llegan al navegador). Los avisos de
      # herramientas de desarrollo (vite, vitest, esbuild) no se ejecutan en el usuario.
      - run: npm audit --omit=dev --audit-level=high
